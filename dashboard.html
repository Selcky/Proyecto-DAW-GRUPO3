<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand">Curso Virtual</span>
        <div>
            <a href="usuarios/lista_usuarios.html" class="btn btn-light btn-sm">Usuarios</a>

            <button onclick="cerrarSesion()" class="btn btn-danger btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h1 id="saludo"></h1>
            <p>Bienvenido al sistema de Cursos</p>
        </div>
    </div>

    <script>
        let usuario = JSON.parse(localStorage.getItem("usuarioActivo"));

        if(!usuario){

            window.location.href = "index.html";

        }

        document.getElementById("saludo").innerHTML =
        "¡Hola, " + usuario.nombre + "! 👋";

        function cerrarSesion(){

            localStorage.removeItem("usuarioActivo");

            window.location.href = "index.html";

        }

    </script>
</body>
</html>
