<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h2>Editar Usuario</h2>

            <form id="formEditar">
                <input type="text" id="nombre"class="form-control mb-3">

                <input type="email" id="correo" class="form-control mb-3">

                <select id="rol" class="form-select mb-3">
                <option>Alumno</option>
                <option>Docente</option>
                </select>

                <button class="btn btn-success">Actualizar</button>
            </form>
        </div>
    </div>

    <script>

        let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

        let index = localStorage.getItem("editarIndex");

        document.getElementById("nombre").value =
        usuarios[index].nombre;

        document.getElementById("correo").value =
        usuarios[index].correo;

        document.getElementById("rol").value =
        usuarios[index].rol;

        document.getElementById("formEditar")
        .addEventListener("submit", function(e){

        e.preventDefault();

        usuarios[index].nombre =
        document.getElementById("nombre").value;

        usuarios[index].correo =
        document.getElementById("correo").value;

        usuarios[index].rol =
        document.getElementById("rol").value;

        localStorage.setItem(
        "usuarios",
        JSON.stringify(usuarios)
        );

        window.location.href =
        "lista_usuarios.html";

        });

    </script>
    <script src="../js/navegacion.js"></script>
</body>
</html>
