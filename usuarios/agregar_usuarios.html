<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h2>Agregar Usuario</h2>

            <form id="formAgregar">
                <input type="text" id="nombre" class="form-control mb-3" placeholder="Nombre" required>

                <input type="email" id="correo" class="form-control mb-3" placeholder="Correo" required>

                <input type="password" id="clave" class="form-control mb-3" placeholder="Contraseña" required>

                <select id="rol" class="form-select mb-3">
                    <option>Alumno</option>
                    <option>Docente</option>
                </select>

                <button class="btn btn-primary"> Guardar </button>
                <a href="lista_usuarios.html" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("formAgregar")
        .addEventListener("submit", function(e){

        e.preventDefault();

        let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

        usuarios.push({

        nombre: document.getElementById("nombre").value,
        correo: document.getElementById("correo").value,
        clave: document.getElementById("clave").value,
        rol: document.getElementById("rol").value

        });
        localStorage.setItem(
        "usuarios",
        JSON.stringify(usuarios)
        );

        window.location.href = "lista_usuarios.html";

        });
    </script>
</body>
</html>
