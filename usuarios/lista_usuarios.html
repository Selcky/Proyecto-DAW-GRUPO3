<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justifiy-content-between mb-3">
            <h2>Usuarios registrados</h2>
            
        </div>

        <table class="table table-bordered table-hover bg-white">
            <thead class="table-primary">
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaUsuarios"></tbody>
        </table>

        <div class="d-flex justifiy-content-between mb-3">
            <a href="agregar_usuarios.html" class="btn btn-primary">Agregar Usuario</a>
            <a href="../dashboard.html " class="btn btn-secondary">Cancelar</a>
        </div>
    </div>

    <script>
        let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

        let tabla = document.getElementById("tablaUsuarios");

        function mostrarUsuarios(){

            tabla.innerHTML = "";

            usuarios.forEach((u, index) => {

                tabla.innerHTML += `

                <tr>

                <td>${u.nombre}</td>
                <td>${u.correo}</td>
                <td>${u.rol}</td>

                <td>

                <button class="btn btn-warning btn-sm"
                        onclick="editar(${index})">

                Editar

                </button>

                <button class="btn btn-danger btn-sm"
                        onclick="eliminar(${index})">

                Eliminar

                </button>

                </td>

                </tr>
                `;
            });

        }

        mostrarUsuarios();

        function eliminar(index){

            usuarios.splice(index, 1);

            localStorage.setItem(
                "usuarios",
                JSON.stringify(usuarios)
            );

            mostrarUsuarios();

        }

        function editar(index){

            localStorage.setItem("editarIndex", index);

            window.location.href = "editar_usuarios.html";

        }
    </script>
    <script src="../js/navegacion.js"></script>

</body>
</html>
