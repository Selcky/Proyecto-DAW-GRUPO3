<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light d-flex justifiy-content-center align-items-center vh-100">
    
        <div class="card p-4 shadow" style="width:400px;">
            <h2 class="text-center text-primary mb-4">Crear Cuenta</h2>

            <form id="registroForm">
                <input type="text" id="nombre" class="form-control mb-3" placeholder="Nombre" required>
                <input type="email" id="correo" class="form-control mb-3" placeholder="Correo" required>
                <input type="password" id="clave" class="form-control mb-3" placeholder="Contraseña" required> 

                <select id="rol" class="form-select mb-3">
                    <option >Alumno</option>
                    <option >Docente</option>
                </select>

                <button class="btn btn-primary w-100">Registrarse</button>
            </form>
        </div>
    

    <script>
        document.getElementById("registroForm")
        .addEventListener("submit", function(e){

            e.preventDefault();

            let nombre = document.getElementById("nombre").value;
            let correo = document.getElementById("correo").value;
            let clave = document.getElementById("clave").value;
            let rol = document.getElementById("rol").value;

            let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            usuarios.push({
                nombre,
                correo,
                clave,
                rol
            });

            localStorage.setItem(
                "usuarios",
                JSON.stringify(usuarios)
            );

            alert("Usuario registrado");

            window.location.href = "index.html";

        });
    </script>
</body>
</html>
