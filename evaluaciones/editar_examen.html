<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Editar Examen</title>

    <!-- Importación de Bootstrap para aplicar estilos prediseñados -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Archivo CSS personalizado del proyecto -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="bg-light">

<!-- Archivo JavaScript que carga la navegación del sistema -->
<script src="../js/navegacion.js"></script>

<!-- Contenedor principal -->
<div class="container mt-5">

    <!-- Tarjeta donde se muestra el formulario de edición -->
    <div class="card shadow p-4">

        <!-- Título principal de la página -->
        <h2 class="text-warning mb-4">Editar Examen</h2>

        <!-- Formulario para editar los datos del examen -->
        <form id="formEditarExamen">

            <!-- Campo para editar el título del examen -->
            <label class="form-label">Título del examen</label>
            <input type="text" id="titulo" class="form-control mb-3" required>

            <!-- Campo para editar el curso -->
            <label class="form-label">Curso</label>
            <input type="text" id="curso" class="form-control mb-3" required>

            <!-- Campo para editar el tiempo límite del examen -->
            <label class="form-label">Tiempo límite en minutos</label>
            <input type="number" id="tiempo" class="form-control mb-3" required>

            <hr>

            <!-- Sección donde se mostrarán las preguntas ya registradas -->
            <h4>Preguntas registradas</h4>
            <div id="listaPreguntas"></div>

            <hr>

            <!-- Sección para agregar una nueva pregunta al examen -->
            <h4>Agregar nueva pregunta</h4>

            <!-- Campo para escribir la nueva pregunta -->
            <input type="text" id="nuevaPregunta" class="form-control mb-3" placeholder="Escriba la pregunta">

            <!-- Campos para ingresar las opciones de la nueva pregunta -->
            <input type="text" id="opcionA" class="form-control mb-2" placeholder="Opción A">
            <input type="text" id="opcionB" class="form-control mb-2" placeholder="Opción B">
            <input type="text" id="opcionC" class="form-control mb-2" placeholder="Opción C">
            <input type="text" id="opcionD" class="form-control mb-2" placeholder="Opción D">

            <!-- Lista desplegable para seleccionar la respuesta correcta -->
            <select id="respuestaCorrecta" class="form-select mb-3">
                <option value="">Seleccione respuesta correcta</option>
                <option value="A">Opción A</option>
                <option value="B">Opción B</option>
                <option value="C">Opción C</option>
                <option value="D">Opción D</option>
            </select>

            <!-- Botón para agregar la nueva pregunta al examen -->
            <button type="button" onclick="agregarPregunta()" class="btn btn-info mb-3">
                Agregar Pregunta
            </button>

            <!-- Botón para guardar los cambios del examen -->
            <button type="submit" class="btn btn-warning">
                Actualizar Examen
            </button>

            <!-- Botón para cancelar y volver a la lista de exámenes -->
            <a href="lista_examenes.html" class="btn btn-secondary mt-2">
                Cancelar
            </a>
        </form>
    </div>
</div>

<script>
    // Obtiene los parámetros enviados en la URL
    // Ejemplo: editar_examen.html?id=12345
    const params = new URLSearchParams(window.location.search);

    // Obtiene el ID del examen desde la URL
    const examenId = params.get("id");

    // Recupera la lista de exámenes guardados en localStorage
    // Si no existe información, crea un arreglo vacío
    let examenes = JSON.parse(localStorage.getItem("examenes")) || [];

    // Busca el examen que tenga el mismo ID recibido por la URL
    let examen = examenes.find(e => e.id == examenId);

    // Si no se encuentra el examen, muestra un mensaje y redirige a la lista
    if (!examen) {
        alert("Examen no encontrado");
        window.location.href = "lista_examenes.html";
    }

    // Carga los datos actuales del examen en los campos del formulario
    document.getElementById("titulo").value = examen.titulo;
    document.getElementById("curso").value = examen.curso;
    document.getElementById("tiempo").value = examen.tiempo;

    // Función que muestra en pantalla todas las preguntas registradas del examen
    function mostrarPreguntas() {

        // Obtiene el contenedor donde se mostrarán las preguntas
        let contenedor = document.getElementById("listaPreguntas");

        // Limpia el contenido del contenedor antes de volver a mostrar las preguntas
        contenedor.innerHTML = "";

        // Recorre cada pregunta del examen
        examen.preguntas.forEach((pregunta, index) => {

            // Agrega una tarjeta HTML por cada pregunta
            contenedor.innerHTML += `
                <div class="card p-3 mb-3">

                    <!-- Muestra el número de la pregunta -->
                    <label class="form-label">Pregunta ${index + 1}</label>

                    <!-- Campo para editar el texto de la pregunta -->
                    <input type="text" class="form-control mb-2" value="${pregunta.texto}"
                        onchange="editarTextoPregunta(${index}, this.value)">

                    <!-- Campo para editar la opción A -->
                    <input type="text" class="form-control mb-2" value="${pregunta.opciones.A}"
                        onchange="editarOpcion(${index}, 'A', this.value)">

                    <!-- Campo para editar la opción B -->
                    <input type="text" class="form-control mb-2" value="${pregunta.opciones.B}"
                        onchange="editarOpcion(${index}, 'B', this.value)">

                    <!-- Campo para editar la opción C -->
                    <input type="text" class="form-control mb-2" value="${pregunta.opciones.C}"
                        onchange="editarOpcion(${index}, 'C', this.value)">

                    <!-- Campo para editar la opción D -->
                    <input type="text" class="form-control mb-2" value="${pregunta.opciones.D}"
                        onchange="editarOpcion(${index}, 'D', this.value)">

                    <!-- Lista para cambiar la respuesta correcta de la pregunta -->
                    <select class="form-select mb-2"
                        onchange="editarRespuesta(${index}, this.value)">

                        <!-- Marca como seleccionada la respuesta correcta actual -->
                        <option value="A" ${pregunta.respuestaCorrecta === "A" ? "selected" : ""}>A</option>
                        <option value="B" ${pregunta.respuestaCorrecta === "B" ? "selected" : ""}>B</option>
                        <option value="C" ${pregunta.respuestaCorrecta === "C" ? "selected" : ""}>C</option>
                        <option value="D" ${pregunta.respuestaCorrecta === "D" ? "selected" : ""}>D</option>
                    </select>

                    <!-- Botón para eliminar una pregunta -->
                    <button type="button" class="btn btn-danger btn-sm"
                        onclick="eliminarPregunta(${index})">
                        Eliminar Pregunta
                    </button>
                </div>
            `;
        });
    }

    // Función para editar el texto de una pregunta existente
    function editarTextoPregunta(index, valor) {
        examen.preguntas[index].texto = valor;
    }

    // Función para editar una opción específica de una pregunta
    function editarOpcion(index, letra, valor) {
        examen.preguntas[index].opciones[letra] = valor;
    }

    // Función para editar la respuesta correcta de una pregunta
    function editarRespuesta(index, valor) {
        examen.preguntas[index].respuestaCorrecta = valor;
    }

    // Función para eliminar una pregunta del examen
    function eliminarPregunta(index) {

        // Pide confirmación antes de eliminar
        if (confirm("¿Desea eliminar esta pregunta?")) {

            // Elimina la pregunta según su posición en el arreglo
            examen.preguntas.splice(index, 1);

            // Vuelve a mostrar la lista actualizada de preguntas
            mostrarPreguntas();
        }
    }

    // Función para agregar una nueva pregunta al examen
    function agregarPregunta() {

        // Obtiene los valores ingresados en los campos de la nueva pregunta
        let texto = document.getElementById("nuevaPregunta").value;
        let opcionA = document.getElementById("opcionA").value;
        let opcionB = document.getElementById("opcionB").value;
        let opcionC = document.getElementById("opcionC").value;
        let opcionD = document.getElementById("opcionD").value;
        let respuesta = document.getElementById("respuestaCorrecta").value;

        // Valida que todos los campos estén completos
        if (!texto || !opcionA || !opcionB || !opcionC || !opcionD || !respuesta) {
            alert("Complete todos los campos de la nueva pregunta");
            return;
        }

        // Agrega la nueva pregunta al arreglo de preguntas del examen
        examen.preguntas.push({
            // Genera un ID único usando la fecha y hora actual
            id: Date.now(),

            // Guarda el texto de la pregunta
            texto: texto,

            // Guarda las opciones de respuesta
            opciones: {
                A: opcionA,
                B: opcionB,
                C: opcionC,
                D: opcionD
            },

            // Guarda la respuesta correcta seleccionada
            respuestaCorrecta: respuesta
        });

        // Limpia los campos después de agregar la pregunta
        document.getElementById("nuevaPregunta").value = "";
        document.getElementById("opcionA").value = "";
        document.getElementById("opcionB").value = "";
        document.getElementById("opcionC").value = "";
        document.getElementById("opcionD").value = "";
        document.getElementById("respuestaCorrecta").value = "";

        // Actualiza la lista de preguntas mostradas en pantalla
        mostrarPreguntas();
    }

    // Evento que se ejecuta al enviar el formulario de edición
    document.getElementById("formEditarExamen").addEventListener("submit", function(e) {

        // Evita que la página se recargue
        e.preventDefault();

        // Actualiza los datos principales del examen
        examen.titulo = document.getElementById("titulo").value;
        examen.curso = document.getElementById("curso").value;
        examen.tiempo = document.getElementById("tiempo").value;

        // Guarda nuevamente el arreglo completo de exámenes en localStorage
        localStorage.setItem("examenes", JSON.stringify(examenes));

        // Muestra mensaje de confirmación
        alert("Examen actualizado correctamente");

        // Redirige a la página de lista de exámenes
        window.location.href = "lista_examenes.html";
    });

    // Muestra las preguntas existentes apenas se carga la página
    mostrarPreguntas();
</script>

</body>
</html>
