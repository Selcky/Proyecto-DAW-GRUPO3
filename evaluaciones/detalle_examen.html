<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Detalle del Examen</title>

    <!-- Importación de Bootstrap para estilos visuales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Archivo CSS propio del proyecto -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="bg-light">

<!-- Archivo JavaScript donde se carga la navegación del sistema -->
<script src="../js/navegacion.js"></script>

<!-- Contenedor principal de la página -->
<div class="container mt-5">

    <!-- Tarjeta visual donde se mostrará el detalle del examen -->
    <div class="card shadow p-4">

        <!-- Título principal -->
        <h2 class="text-primary mb-3">Detalle del Examen</h2>

        <!-- Aquí se mostrará la información del examen usando JavaScript -->
        <div id="detalleExamen"></div>

        <!-- Botón para regresar a la lista de exámenes -->
        <a href="lista_examenes.html" class="btn btn-secondary mt-3">Volver</a>
    </div>
</div>

<script>
    // Obtiene los parámetros que vienen en la URL
    // Por ejemplo: detalle_examen.html?id=12345
    const params = new URLSearchParams(window.location.search);

    // Obtiene el valor del parámetro "id" de la URL
    const examenId = params.get("id");

    // Recupera del localStorage la lista de exámenes guardados
    // Si no existe ningún examen, crea un arreglo vacío
    let examenes = JSON.parse(localStorage.getItem("examenes")) || [];

    // Busca dentro del arreglo el examen que tenga el mismo ID recibido por la URL
    let examen = examenes.find(e => e.id == examenId);

    // Obtiene el contenedor HTML donde se mostrará el detalle del examen
    let contenedor = document.getElementById("detalleExamen");

    // Si no se encuentra el examen, muestra un mensaje de error
    if (!examen) {
        contenedor.innerHTML = `
            <div class="alert alert-danger">
                Examen no encontrado.
            </div>
        `;
    } else {

        // Si el examen existe, se crea una estructura HTML con sus datos principales
        let html = `
            <h3>${examen.titulo}</h3>
            <p><strong>Curso:</strong> ${examen.curso}</p>
            <p><strong>Tiempo:</strong> ${examen.tiempo} minutos</p>
            <p><strong>Fecha de creación:</strong> ${examen.fechaCreacion}</p>

            <hr>

            <h4>Preguntas</h4>
        `;

        // Recorre todas las preguntas del examen
        examen.preguntas.forEach((pregunta, index) => {

            // Agrega al HTML una tarjeta por cada pregunta
            html += `
                <div class="card p-3 mb-3">

                    <!-- Número de pregunta -->
                    <h5>Pregunta ${index + 1}</h5>

                    <!-- Texto de la pregunta -->
                    <p>${pregunta.texto}</p>

                    <!-- Opciones de respuesta -->
                    <ul>
                        <li><strong>A:</strong> ${pregunta.opciones.A}</li>
                        <li><strong>B:</strong> ${pregunta.opciones.B}</li>
                        <li><strong>C:</strong> ${pregunta.opciones.C}</li>
                        <li><strong>D:</strong> ${pregunta.opciones.D}</li>
                    </ul>

                    <!-- Muestra la respuesta correcta -->
                    <p class="text-success">
                        <strong>Respuesta correcta:</strong> ${pregunta.respuestaCorrecta}
                    </p>
                </div>
            `;
        });

        // Inserta todo el HTML generado dentro del contenedor de la página
        contenedor.innerHTML = html;
    }
</script>

</body>
</html>
