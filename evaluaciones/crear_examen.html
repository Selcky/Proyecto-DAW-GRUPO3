<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Crear Examen</title>

    <!-- Importación de Bootstrap para usar estilos prediseñados -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Archivo CSS propio del proyecto -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="bg-light">

<!-- Archivo JavaScript para cargar la navegación del sistema -->
<script src="../js/navegacion.js"></script>

<!-- Contenedor principal -->
<div class="container mt-5">

    <!-- Tarjeta visual donde se encuentra el formulario -->
    <div class="card shadow p-4">

        <!-- Título principal de la página -->
        <h2 class="text-primary mb-4">Crear Nuevo Examen</h2>

        <!-- Formulario para crear el examen -->
        <form id="formExamen">

            <!-- Campo para ingresar el título del examen -->
            <label class="form-label">Título del examen</label>
            <input type="text" id="titulo" class="form-control mb-3" required>

            <!-- Campo para ingresar el curso al que pertenece el examen -->
            <label class="form-label">Curso</label>
            <input type="text" id="curso" class="form-control mb-3" required>

            <!-- Campo para ingresar el tiempo límite del examen -->
            <label class="form-label">Tiempo límite en minutos</label>
            <input type="number" id="tiempo" class="form-control mb-3" required>

            <hr>

            <!-- Sección para agregar preguntas al examen -->
            <h4>Agregar Pregunta</h4>

            <!-- Campo para escribir la pregunta -->
            <input type="text" id="pregunta" class="form-control mb-3" placeholder="Escriba la pregunta">

            <!-- Campos para ingresar las opciones de respuesta -->
            <input type="text" id="opcion1" class="form-control mb-2" placeholder="Opción A">
            <input type="text" id="opcion2" class="form-control mb-2" placeholder="Opción B">
            <input type="text" id="opcion3" class="form-control mb-2" placeholder="Opción C">
            <input type="text" id="opcion4" class="form-control mb-2" placeholder="Opción D">

            <!-- Lista desplegable para seleccionar la respuesta correcta -->
            <select id="respuestaCorrecta" class="form-select mb-3">
                <option value="">Seleccione la respuesta correcta</option>
                <option value="A">Opción A</option>
                <option value="B">Opción B</option>
                <option value="C">Opción C</option>
                <option value="D">Opción D</option>
            </select>

            <!-- Botón para agregar la pregunta al arreglo de preguntas -->
            <button type="button" onclick="agregarPregunta()" class="btn btn-info mb-3">
                Agregar Pregunta
            </button>

            <!-- Muestra la cantidad de preguntas agregadas -->
            <div class="alert alert-secondary">
                Preguntas agregadas: <strong id="contadorPreguntas">0</strong>
            </div>

            <!-- Botón para guardar el examen completo -->
            <button type="submit" class="btn btn-success">Guardar Examen</button>

            <!-- Botón para cancelar y regresar a la lista de exámenes -->
            <a href="lista_examenes.html" class="btn btn-secondary mt-2">Cancelar</a>
        </form>
    </div>
</div>

<script>
    // Arreglo donde se almacenan temporalmente las preguntas agregadas
    let preguntas = [];

    // Función para agregar una pregunta al examen
    function agregarPregunta() {

        // Se obtienen los valores escritos por el usuario en los campos del formulario
        let textoPregunta = document.getElementById("pregunta").value;
        let opcion1 = document.getElementById("opcion1").value;
        let opcion2 = document.getElementById("opcion2").value;
        let opcion3 = document.getElementById("opcion3").value;
        let opcion4 = document.getElementById("opcion4").value;
        let respuestaCorrecta = document.getElementById("respuestaCorrecta").value;

        // Validación para comprobar que todos los campos de la pregunta estén completos
        if (!textoPregunta || !opcion1 || !opcion2 || !opcion3 || !opcion4 || !respuestaCorrecta) {
            alert("Complete todos los campos de la pregunta");
            return;
        }

        // Se agrega la pregunta al arreglo de preguntas
        preguntas.push({
            // Se usa Date.now() para generar un ID único basado en la fecha y hora actual
            id: Date.now(),

            // Texto de la pregunta
            texto: textoPregunta,

            // Opciones de respuesta
            opciones: {
                A: opcion1,
                B: opcion2,
                C: opcion3,
                D: opcion4
            },

            // Respuesta correcta seleccionada por el usuario
            respuestaCorrecta: respuestaCorrecta
        });

        // Se actualiza el contador de preguntas agregadas en la pantalla
        document.getElementById("contadorPreguntas").innerText = preguntas.length;

        // Se limpian los campos después de agregar la pregunta
        document.getElementById("pregunta").value = "";
        document.getElementById("opcion1").value = "";
        document.getElementById("opcion2").value = "";
        document.getElementById("opcion3").value = "";
        document.getElementById("opcion4").value = "";
        document.getElementById("respuestaCorrecta").value = "";

        // Mensaje de confirmación
        alert("Pregunta agregada");
    }

    // Evento que se ejecuta cuando el usuario intenta guardar el examen
    document.getElementById("formExamen").addEventListener("submit", function(e) {

        // Evita que el formulario recargue la página
        e.preventDefault();

        // Valida que exista al menos una pregunta agregada
        if (preguntas.length === 0) {
            alert("Debe agregar al menos una pregunta");
            return;
        }

        // Se obtienen los exámenes guardados anteriormente en localStorage
        // Si no existen, se crea un arreglo vacío
        let examenes = JSON.parse(localStorage.getItem("examenes")) || [];

        // Se crea un nuevo objeto examen con los datos ingresados
        let nuevoExamen = {
            // ID único para el examen
            id: Date.now(),

            // Título del examen
            titulo: document.getElementById("titulo").value,

            // Curso del examen
            curso: document.getElementById("curso").value,

            // Tiempo límite del examen
            tiempo: document.getElementById("tiempo").value,

            // Preguntas agregadas al examen
            preguntas: preguntas,

            // Fecha en la que se creó el examen
            fechaCreacion: new Date().toLocaleDateString("es-ES")
        };

        // Se agrega el nuevo examen al arreglo de exámenes
        examenes.push(nuevoExamen);

        // Se guarda el arreglo actualizado en localStorage
        localStorage.setItem("examenes", JSON.stringify(examenes));

        // Mensaje de confirmación
        alert("Examen creado correctamente");

        // Redirección hacia la página de lista de exámenes
        window.location.href = "lista_examenes.html";
    });
</script>

</body>
</html>
