<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/navegacion.js"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4" style="max-width: 600px; margin: 0 auto;">
            <h2 class="mb-4 text-warning"> Editar Curso</h2>

            <form id="formEditar">
                <label class="form-label fw-bold">Nombre del Curso</label>
                <input type="text" id="nombre" class="form-control mb-3" required>

                <label class="form-label fw-bold">Categoría</label>
                <select id="categoria" class="form-select mb-3" required>
                    <option value="Tecnología">Tecnología</option>
                    <option value="Negocios">Negocios</option>
                    <option value="Diseño">Diseño</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Idiomas">Idiomas</option>
                    <option value="Otros">Otros</option>
                </select>

                <label class="form-label fw-bold">Docente</label>
                <input type="text" id="docente" class="form-control mb-3" required>

                <label class="form-label fw-bold">Descripción</label>
                <textarea id="descripcion" class="form-control mb-3" rows="4" required></textarea>

                <label class="form-label fw-bold">Duración (horas)</label>
                <input type="number" id="duracion" class="form-control mb-3" min="1" required>

                <label class="form-label fw-bold">Precio ($)</label>
                <input type="number" id="precio" class="form-control mb-3" min="0" step="0.01" required>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning w-100"> Actualizar</button>
                    <a href="lista_cursos.html" class="btn btn-secondary w-100">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Obtener ID del parámetro de URL
        const params = new URLSearchParams(window.location.search);
        const cursoId = params.get('id');

        if (!cursoId) {
            alert("Error: No se especificó curso");
            window.location.href = "lista_cursos.html";
        }

        // Cargar datos del curso
        let cursos = JSON.parse(localStorage.getItem("cursos")) || [];
        let cursoActual = cursos.find(c => c.id == cursoId);

        if (!cursoActual) {
            alert("Error: Curso no encontrado");
            window.location.href = "lista_cursos.html";
        }

        // Llenar formulario con datos actuales
        document.getElementById("nombre").value = cursoActual.nombre;
        document.getElementById("categoria").value = cursoActual.categoria;
        document.getElementById("docente").value = cursoActual.docente;
        document.getElementById("descripcion").value = cursoActual.descripcion;
        document.getElementById("duracion").value = cursoActual.duracion;
        document.getElementById("precio").value = cursoActual.precio;

        // Guardar cambios
        document.getElementById("formEditar").addEventListener("submit", function(e){
            e.preventDefault();

            // Actualizar datos
            cursoActual.nombre = document.getElementById("nombre").value;
            cursoActual.categoria = document.getElementById("categoria").value;
            cursoActual.docente = document.getElementById("docente").value;
            cursoActual.descripcion = document.getElementById("descripcion").value;
            cursoActual.duracion = document.getElementById("duracion").value;
            cursoActual.precio = document.getElementById("precio").value;

            // Guardar en localStorage
            localStorage.setItem("cursos", JSON.stringify(cursos));

            alert("Curso actualizado");
            window.location.href = "lista_cursos.html";
        });
    </script>
</body>
</html>
