<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/navegacion.js"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm border-0" style="max-width: 600px; margin: 0 auto;">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0">
                    <i class="bi bi-pencil-square"></i> Editar Curso
                </h5>
            </div>

            <div class="card-body p-4">
                <form id="formEditar">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-book"></i> Nombre del Curso
                        </label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-folder"></i> Categoría
                        </label>
                        <select id="categoria" class="form-select" required>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Negocios">Negocios</option>
                            <option value="Diseño">Diseño</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Idiomas">Idiomas</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-person-badge"></i> Docente
                        </label>
                        <input type="text" id="docente" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-chat-left-text"></i> Descripción
                        </label>
                        <textarea id="descripcion" class="form-control" rows="4" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-hourglass-split"></i> Duración (horas)
                        </label>
                        <input type="number" id="duracion" class="form-control" min="1" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="bi bi-currency-dollar"></i> Precio
                        </label>
                        <input type="number" id="precio" class="form-control" min="0" step="0.01" required>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-between">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-circle"></i> Actualizar
                        </button>
                        <a href="lista_cursos.html" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const cursoId = params.get('id');

        if (!cursoId) {
            alert("Error: No se especificó curso");
            window.location.href = "lista_cursos.html";
        }

        let cursos = JSON.parse(localStorage.getItem("cursos")) || [];
        let cursoActual = cursos.find(c => c.id == cursoId);

        if (!cursoActual) {
            alert("Error: Curso no encontrado");
            window.location.href = "lista_cursos.html";
        }

        document.getElementById("nombre").value = cursoActual.nombre;
        document.getElementById("categoria").value = cursoActual.categoria;
        document.getElementById("docente").value = cursoActual.docente;
        document.getElementById("descripcion").value = cursoActual.descripcion;
        document.getElementById("duracion").value = cursoActual.duracion;
        document.getElementById("precio").value = cursoActual.precio;

        document.getElementById("formEditar").addEventListener("submit", function(e){
            e.preventDefault();

            cursoActual.nombre = document.getElementById("nombre").value;
            cursoActual.categoria = document.getElementById("categoria").value;
            cursoActual.docente = document.getElementById("docente").value;
            cursoActual.descripcion = document.getElementById("descripcion").value;
            cursoActual.duracion = document.getElementById("duracion").value;
            cursoActual.precio = document.getElementById("precio").value;

            localStorage.setItem("cursos", JSON.stringify(cursos));

            alert("Curso actualizado correctamente");
            window.location.href = "lista_cursos.html";
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
