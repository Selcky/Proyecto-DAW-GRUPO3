<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/navegacion.js"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <!-- Botones de acción -->
        <div class="d-flex justify-content-between mb-4">
            <h2 class="text-primary">📚 Lista de Cursos</h2>
            <a href="crear_curso.html" class="btn btn-success">
                 Nuevo Curso
            </a>
        </div>

        <!-- Tabla de cursos -->
        <div class="card shadow p-4">
            <table class="table table-bordered table-hover" id="tablaCursos">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Docente</th>
                        <th>Duración</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="bodyTabla">
                    <!-- Los cursos se cargarán aquí con JavaScript -->
                </tbody>
            </table>

            <!-- Mensaje si no hay cursos -->
            <div id="mensajeVacio" class="alert alert-info text-center" style="display: none;">
                No hay cursos registrados. <a href="crear_curso.html">Crear uno ahora</a>
            </div>
        </div>
    </div>

    <script>
        // Cargar cursos al abrir la página
        function cargarCursos() {
            let cursos = JSON.parse(localStorage.getItem("cursos")) || [];
            let bodyTabla = document.getElementById("bodyTabla");
            let mensajeVacio = document.getElementById("mensajeVacio");

            // Limpiar tabla
            bodyTabla.innerHTML = "";

            // Si no hay cursos
            if (cursos.length === 0) {
                document.getElementById("tablaCursos").style.display = "none";
                mensajeVacio.style.display = "block";
                return;
            }

            // Mostrar tabla
            document.getElementById("tablaCursos").style.display = "table";
            mensajeVacio.style.display = "none";

            // Agregar cada curso a la tabla
            cursos.forEach((curso, index) => {
                let fila = `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${curso.nombre}</strong></td>
                        <td><span class="badge bg-info">${curso.categoria}</span></td>
                        <td>${curso.docente}</td>
                        <td>${curso.duracion} hrs</td>
                        <td>$${parseFloat(curso.precio).toFixed(2)}</td>
                        <td>
                            <a href="detalle_curso.html?id=${curso.id}" class="btn btn-info btn-sm">
                                👁️ Ver
                            </a>
                            <a href="editar_curso.html?id=${curso.id}" class="btn btn-warning btn-sm">
                                ✏️ Editar
                            </a>
                            <button onclick="eliminarCurso(${curso.id})" class="btn btn-danger btn-sm">
                                🗑️ Eliminar
                            </button>
                        </td>
                    </tr>
                `;
                bodyTabla.innerHTML += fila;
            });
        }

        // Función para eliminar un curso
        function eliminarCurso(id) {
            if (confirm("¿Está seguro de que desea eliminar este curso?")) {
                let cursos = JSON.parse(localStorage.getItem("cursos")) || [];
                cursos = cursos.filter(c => c.id !== id);
                localStorage.setItem("cursos", JSON.stringify(cursos));
                alert(" Curso eliminado");
                cargarCursos();
            }
        }

        // Cargar cursos cuando la página inicia
        document.addEventListener("DOMContentLoaded", cargarCursos);
    </script>
</body>
</html>
