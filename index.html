<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light  d-flex justify-content-center align-items-center vh-100">
    
    <div class="card p-4 shadow" style="width:400px;">
        <h2 class="text-center mb-4 text-primary">Plataforma de Cursos Virtuales</h2>

        <form id="loginForm">
            <input type="email" id="correo" class="form-control mb-3" placeholder="Correo" required>

            <input type="password" id="clave" class="form-control mb-3" placeholder="Contraseña" required>

            <button class="btn btn-primary w-100">Iniciar Sesión</button>
        </form>

        <a href="registro.html" class="btn btn-outline-primary mt-3 w-100">Registrarse</a>
    </div>
    

    <script>
        // Protección: si ya hay sesión, ir al dashboard
        let usuarioActivo = JSON.parse(localStorage.getItem("usuarioActivo"));
        if (usuarioActivo) {
            window.location.href = "dashboard.html";
        }
    </script>
    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(e){
            e.preventDefault();

            let correo = document.getElementById("correo").value;
            let clave = document.getElementById("clave").value;

            let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            let usuarioEncontrado = usuarios.find(u =>
                u.correo === correo &&
                u.clave === clave
        );

        if(usuarioEncontrado){
            localStorage.setItem("usuarioActivo", JSON.stringify(usuarioEncontrado));

            window.location.href ="dashboard.html";

        }else{
            alert("Correo o contraseña incorrectos");
        }

    });
    </script>
    
</body>
</html>
